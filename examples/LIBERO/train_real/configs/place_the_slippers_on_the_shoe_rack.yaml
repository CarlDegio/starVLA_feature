# Independent task training; video storage 320x240, existing loader resize 224x224.
# lerobot_version v2.0 selects the legacy reader for the LeRobot v2.1 directory layout.
run_id: qwen3fast_edl_real_place_the_slippers_on_the_shoe_rack_edl_1e-2_state
run_root_dir: ./playground/Checkpoints
seed: 42
wandb_entity: carldegio
wandb_project: starVLA_EDL_Real
is_debug: false
version_id: '0.21'
framework:
  name: QwenEDL
  qwenvl:
    base_vlm: playground/Pretrained_models/Qwen3-VL-4B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_model_type: FAST
    action_dim: 14
    state_dim: 14
    action_horizon: 30
    future_action_window_size: 29
    past_action_window_size: 0
  state_input:
    enabled: true
    num_bins: 256
  edl:
    loss_type: digamma
    topk: 25
    kl_weight: 0.01
    annealing_steps: 15000
    evidence_fn: softplus
datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/edl_real
    data_mix: edl_real_place_the_slippers_on_the_shoe_rack
    lerobot_version: v2.0
    action_type: joint_targets
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 32
    num_workers: 10
    load_all_data_for_training: true
    video_backend: torchvision_av
    include_state: true
    CoT_prompt: Your task is {instruction}.
trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 15000
  save_final_model: false
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: false
  optimizer:
    name: AdamW
    betas:
    - 0.9
    - 0.95
    eps: 1.0e-08
    weight_decay: 1.0e-08
  eval_batch_size: 4
  eval_max_new_tokens: 256
